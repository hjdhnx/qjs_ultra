name: qjs_ultra
# KEEP THIS FILE ASCII-ONLY. pub reads git-sourced pubspecs via `git show`
# stdout decoded with systemEncoding; on Chinese Windows (CP936) UTF-8
# non-ASCII gets GBK-misdecoded and byte misalignment eats the `version:`
# line, so the version always resolves to 0.0.0 (Dart 3.13.2, verified).
# Explanations in Chinese belong in README, never here.
description: QuickJS engine Dart/FFI bindings and wrapper (libquickjs_bridge.so). Dart-only, no Flutter deps. C sources in-repo; .so built by CI.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  ffi: '>=2.1.3 <4.0.0'

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
