name: Build quickjs_bridge

on:
  push:
    branches: [main]
    # 只有源码/构建链改动才触发（并自动发 Release）；纯文档提交跳过，
    # 免得每次改 README 都跑一遍四架构编译 + 堆一个 Release。
    paths:
      - 'bridge/**'
      - 'native/**'
      - 'CMakeLists.txt'
      - 'abi/**'          # 符号基线变更 = ABI 变更，必须重新构建验证
      - 'lib/**'          # Dart 包（绑定须与 so 同步验证）
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'bridge/**'
      - 'native/**'
      - 'CMakeLists.txt'
      - 'abi/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      arches:
        description: '要构建的架构（空格分隔：arm64-v8a armeabi-v7a x86 x86_64）'
        required: false
        default: 'arm64-v8a armeabi-v7a x86 x86_64'
        type: string
      release:
        description: '手动触发时是否发布 Release（push 触发会自动发布，无需勾选）'
        required: false
        default: false
        type: boolean
      releaseTag:
        description: 'Release tag（留空 = build-<日期>-<短提交>）'
        required: false
        type: string

permissions:
  contents: write

env:
  # 与本地构建链一致的锚点（改动需同步 README 与 DsPlayer 侧文档）
  NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1
  ANDROID_PLATFORM: android-24

jobs:
  # 把 arches 输入解析成 matrix（workflow_dispatch 的输入不能直接用 fromJSON）
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          ARCHES_INPUT: ${{ github.event.inputs.arches }}
        run: |
          ARCHES="$ARCHES_INPUT"
          [ -n "$ARCHES" ] || ARCHES="arm64-v8a armeabi-v7a x86 x86_64"
          # 校验架构名合法，避免手输错值静默产不出东西
          for a in $ARCHES; do
            case "$a" in
              arm64-v8a|armeabi-v7a|x86|x86_64) ;;
              *) echo "未知架构: $a（可选 arm64-v8a armeabi-v7a x86 x86_64）" >&2; exit 1 ;;
            esac
          done
          JSON=$(printf '%s\n' $ARCHES | jq -R . | jq -sc .)
          echo "matrix={\"abi\":$JSON}" >> "$GITHUB_OUTPUT"
          echo "构建架构：$ARCHES"

  build:
    name: Build ${{ matrix.abi }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # BoringSSL 源码编译需要 Go（BoringSSL 的生成阶段是 Go 写的）
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      # sdkmanager 需要 JDK 17+（runner 默认 11，不加这步 setup-android 直接失败）
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + CMake
        run: |
          set -e
          # action 提供的环境变量名各版本不一，按序回退（缺失会导致 NDK 路径为空 → 配置阶段才炸）
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "找不到 Android SDK: $SDK"; exit 1; }
          sdkmanager "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "CMAKE_BIN=$SDK/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          set -e
          export PATH="$CMAKE_BIN:$PATH"
          cmake -S . -B "build/${{ matrix.abi }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DQJS_USE_BORINGSSL_SOURCE=ON \
            -DBUILD_TESTING=OFF

      - name: Build
        run: |
          set -e
          export PATH="$CMAKE_BIN:$PATH"
          cmake --build "build/${{ matrix.abi }}" -j"$(nproc)"

      - name: Collect and verify
        run: |
          set -e
          export PATH="$CMAKE_BIN:$PATH"
          abi="${{ matrix.abi }}"
          mkdir -p out
          so="build/$abi/libquickjs_bridge.so"
          [ -f "$so" ] || { echo "未找到产物: $so"; find build -name '*.so' | head; exit 1; }
          cp "$so" "out/libquickjs_bridge-$abi.so"
          echo "===== 产物校验 ====="
          readelf -h "$so" | grep -E 'Class|Machine' | sed 's/^/  /'
          echo "  so 大小: $(du -h "$so" | cut -f1)"
          # 导出符号基线校验（宿主 Dart 直接 FFI 调用，且签名严格对应）
          # 清单 = abi/exports.txt（51 个函数，与现役生产 so 逐一对齐）。
          # 少一个即 ABI 不完整、多一个需同步 Dart 绑定。改 so 后若确实要增删
          # 导出函数，必须同步更新此清单 + Dart 绑定 + 升本体版本（见 README ABI 契约）。
          mapfile -t expect < <(grep -vE '^\s*(#|$)' abi/exports.txt | tr -d '\r')
          mapfile -t actual < <(nm -D --defined-only "$so" | awk '{print $NF}' | grep '^qjs_' | sort | tr -d '\r')
          echo "  导出符号数：期望 ${#expect[@]}，实际 ${#actual[@]}"
          missing=$(comm -23 <(printf '%s\n' "${expect[@]}" | sort) <(printf '%s\n' "${actual[@]}"))
          if [ -n "$missing" ]; then
            echo "缺少导出符号："; echo "$missing" | sed 's/^/    /'; exit 1
          fi
          extra=$(comm -13 <(printf '%s\n' "${expect[@]}" | sort) <(printf '%s\n' "${actual[@]}"))
          if [ -n "$extra" ]; then
            echo "新增导出符号（若为有意新增，请同步 abi/exports.txt + Dart 绑定 + 升本体版本）："
            echo "$extra" | sed 's/^/    /'
          fi
          echo "  符号校验通过"
          echo "  动态依赖:"
          readelf -d "$so" | grep NEEDED | sed 's/.*\[/    /;s/\]//'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: so-${{ matrix.abi }}
          path: out/*.so

  # Windows x64 DLL：给 Dart 包的**真实引擎测试**用（CI 在本机加载跑用例，
  # 见 dart-check job）。上游 CMakeLists 的 WIN32 分支已处理 MinGW 兼容
  # （strndup / sized delete 补丁），这里只需装 mingw 与 cmake。
  build-windows:
    name: Build windows-x64 (dll)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      # MSYS2/MinGW-w64：CMakeLists 为 MinGW 写了兼容补丁，须用 GNU 工具链
      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build/windows-x64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/windows-x64 -j"$(nproc)"

      - name: Collect and verify
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p out
          dll="build/windows-x64/quickjs_bridge.dll"
          [ -f "$dll" ] || { echo "未找到产物: $dll"; find build -name '*.dll' | head; exit 1; }
          cp "$dll" "out/quickjs_bridge-windows-x64.dll"
          echo "  大小: $(du -h "$dll" | cut -f1)"
          # 符号基线校验（与本包 Dart 绑定对应的 ABI 契约）
          mapfile -t expect < <(grep -vE '^\s*(#|$)' abi/exports.txt | tr -d '\r')
          mapfile -t actual < <(objdump -p "$dll" | grep -oE 'qjs_[a-z_0-9]+' | sort -u || true)
          missing=$(comm -23 <(printf '%s\n' "${expect[@]}" | sort) <(printf '%s\n' "${actual[@]}"))
          if [ -n "$missing" ]; then echo "缺少导出符号："; echo "$missing" | sed 's/^/    /'; exit 1; fi
          echo "  符号校验通过（${#expect[@]} 个）"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dll-windows-x64
          path: out/*.dll

  # Dart 包校验：analyze + 用真实 Windows DLL 跑引擎测试。
  # 这是绑定层的**行为验证**——函数签名写错、结构体布局不符、内存管理漏 free
  # 都只会在真正调用的那一刻暴露，静态分析查不出来。
  dart-check:
    name: Dart analyze + engine tests
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download windows dll
        uses: actions/download-artifact@v7
        with:
          name: dll-windows-x64
          path: native/windows/x64

      # 产物名带后缀，测试的 _resolveLib 按约定名找 —— 归一过去
      - name: Normalize dll name
        shell: bash
        run: mv native/windows/x64/quickjs_bridge-windows-x64.dll native/windows/x64/quickjs_bridge.dll

      - name: Pub get
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Engine tests（真实加载 dll）
        run: dart test --reporter expanded

  # 汇总发布：把四个架构的 .so 合成一份 Release（含校验和与构建信息）
  #
  # 触发条件：push 到 main（已由 on.push.paths 过滤为源码/构建链改动）自动发布；
  # 手动触发需勾选 release。PR 不发布（event_name 为 pull_request）。
  release:
    name: Release
    needs: [build, dart-check]
    if: ${{ github.event_name == 'push' || github.event.inputs.release == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          pattern: so-*
          merge-multiple: true
          path: out

      - name: Download windows dll
        uses: actions/download-artifact@v7
        with:
          pattern: dll-*
          merge-multiple: true
          path: out

      - name: Prepare release assets
        run: |
          set -e
          cd out
          ls -la
          # 覆盖 so 与 dll（Windows 需 MSYS 的 sha256sum，本 job 跑在 ubuntu）
          sha256sum libquickjs_bridge-*.so quickjs_bridge-*.dll > SHA256SUMS
          md5sum libquickjs_bridge-*.so quickjs_bridge-*.dll > MD5SUMS
          {
            echo "# quickjs_bridge Android 构建"
            echo
            echo "- 构建时间（UTC）：$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo "- NDK \`${NDK_VERSION}\` ｜ CMake \`${CMAKE_VERSION}\` ｜ platform \`${ANDROID_PLATFORM}\`"
            echo "- 引擎：QuickJS + BoringSSL（源码编译，Go 生成）+ lexbor/sqlite3/zlib/wasm3"
            echo
            echo "## 产物"
            echo
            for f in libquickjs_bridge-*.so quickjs_bridge-*.dll; do
              printf -- '- `%s`（%s，sha256 %s…）\n' "$f" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -c1-16)"
            done
            echo
            echo "## 用途"
            echo
            echo 'DsPlayer「QJS 引擎插件」（plugin_qjs）的 so 载体：'
            echo '`libquickjs_bridge-<abi>.so` → `plugin_qjs/app/src/main/jniLibs/<abi>/libquickjs_bridge.so`。'
            echo
            echo '**ABI 契约**：本 so 的导出函数签名（如 `qjs_set_callbacks` 首参 ctx）'
            echo '与 DsPlayer 的 Dart FFI 绑定严格对应，改签名 = 改 ABI ——'
            echo '必须同时升本体版本并出包，否则旧本体加载新 so 会 SIGSEGV 启动崩溃。'
            echo
            echo '校验：`SHA256SUMS` / `MD5SUMS`。'
          } > BUILD-INFO.md

      - name: Set Tag Name
        id: tag
        env:
          TAG_INPUT: ${{ github.event.inputs.releaseTag }}
        run: |
          TAG="$TAG_INPUT"
          [ -n "$TAG" ] || TAG="build-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: out/BUILD-INFO.md
          make_latest: "true"
          files: |
            out/libquickjs_bridge-*.so
            out/quickjs_bridge-*.dll
            out/SHA256SUMS
            out/MD5SUMS
            out/BUILD-INFO.md
